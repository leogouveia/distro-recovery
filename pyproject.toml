[project]
name = "distro-recovery"
version = "0.1.0"
description = "Inventário e restauração de aplicativos instalados no Linux (YAML + Ansible)"
readme = "README.md"
authors = [
    { name = "Leonardo de Albuquerque Gouveia", email = "leogouv@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ruamel-yaml>=0.19.1",
    "typer>=0.27.3",
]

[project.scripts]
distro-recovery = "distro_recovery.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ansible-core>=2.19.14",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
